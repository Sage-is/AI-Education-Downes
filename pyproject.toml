[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "downes"
version = "0.1.0"
description = "AI agent for education analysis."
authors = []
license = {text = "AGPL-3.0-or-later"}
requires-python = ">=3.10"
dependencies = [
    "googlenewsdecoder>=0.1.7",
    "langchain>=0.3.27",
    "langchain-openai>=0.3.35",
    "openai>=2.2.0",
    "prompt-toolkit>=3.0.0",
    "pydantic>=2.11.10",
    "python-dotenv>=1.1.1",
    "requests>=2.32.5",
    "beautifulsoup4>=4.12.3",
    "yfinance>=0.2.40",  # Free Yahoo Finance data
    "pyyaml>=6.0",
]

[project.scripts]
downes-agent = "downes.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
